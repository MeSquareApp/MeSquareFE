# MeSquareFE — Docker Compose
#
# Production (static web build served by nginx):
#   docker compose up --build            # http://localhost:8080
#
# Development (Expo dev server with hot reload):
#   docker compose --profile dev up      # http://localhost:8081
#
# EXPO_PUBLIC_* build args are read from a `.env` file next to this file
# (see .env.example). They are inlined into the bundle at build time, so
# changing them requires rebuilding: docker compose build --no-cache web.

services:
  # Production: multi-stage build -> Caddy serving the static web export.
  web:
    build:
      context: .
      target: prod
      args:
        EXPO_PUBLIC_AUTH0_DOMAIN: ${EXPO_PUBLIC_AUTH0_DOMAIN:?Set EXPO_PUBLIC_AUTH0_DOMAIN in .env (see .env.example)}
        EXPO_PUBLIC_AUTH0_CLIENT_ID: ${EXPO_PUBLIC_AUTH0_CLIENT_ID:-}
        EXPO_PUBLIC_AUTH0_AUDIENCE: ${EXPO_PUBLIC_AUTH0_AUDIENCE:-}
        EXPO_PUBLIC_API_BASE_URL: ${EXPO_PUBLIC_API_BASE_URL:-}
    image: mesquarefe-web
    ports:
      - "8080:8080"
    restart: unless-stopped

  # Development: Expo dev server. Source is bind-mounted; node_modules live
  # in a named volume seeded from the image's deps layer.
  dev:
    profiles: ["dev"]
    build:
      context: .
      target: dev
    image: mesquarefe-dev
    ports:
      - "8081:8081"
    environment:
      EXPO_NO_TELEMETRY: 1
    volumes:
      - .:/app
      - mesquarefe_node_modules:/app/node_modules

volumes:
  mesquarefe_node_modules:
